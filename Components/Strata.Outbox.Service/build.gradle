plugins {
    id 'java-library'
    id "com.github.davidmc24.gradle.plugin.avro-base" version "1.3.0"
}

sourceSets {
    main.java.srcDirs = ['src/main/java','build/generated-java']
    main.resources.srcDirs = ['src/main/resources','src/main/schema']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

import com.github.davidmc24.gradle.plugin.avro.GenerateAvroJavaTask

apply plugin: 'maven-publish'
apply plugin: "com.github.davidmc24.gradle.plugin.avro-base"

group 'strata.outbox'
version "$major$minor$patch"

configurations {
    avroSchema
}

dependencies {
    implementation "org.apache.avro:avro:1.11.0"
    avroSchema "strata.foundation:strata-foundation-core:$version"
}

def importAvroSchema = tasks.register('importAvroSchema', Copy) {
    from {
        configurations.avroSchema.collect { it.isDirectory() ? it : zipTree(it) }
    }
    include "avro/*.avsc"
    into layout.buildDirectory.dir("imported-schema")
}

def genAvro = tasks.register("genAvro", GenerateAvroJavaTask) {
    source = file("src/main/schema/avro")
    outputDir = file("build/generated-java")
    createSetters = true
    createOptionalGetters = false
    gettersReturnOptional = false
    optionalGettersForNullableFieldsOnly = false
    fieldVisibility = "PRIVATE"
    outputCharacterEncoding = "UTF-8"
    stringType = "String"
    enableDecimalLogicalType = true
}

tasks.named("genAvro").configure {
    source(importAvroSchema)
}

tasks.named("compileJava").configure {
    source(genAvro)
}

publishing {
    publications {
        SayinUserService(MavenPublication) {
            artifactId = 'sayin-user-service'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api "strata.foundation:strata-foundation-core:$version"
    api 'org.springframework.security:spring-security-core:6.2.1'
    api "org.springframework.boot:spring-boot-starter-web:$springboot_version"
}