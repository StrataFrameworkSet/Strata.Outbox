plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}


apply plugin: 'maven-publish'


task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        StrataOutboxCore(MavenPublication) {
            artifactId = 'strata-outbox-core'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api "strata.server:strata-server-core:$strata_server_version"
    api "strata.foundation:strata-foundation-spring:$strata_foundation_version"
    api "org.springframework.boot:spring-boot-starter-security:$springboot_version"
    api "org.springframework.security:spring-security-core:$spring_security_version"
    api "org.postgresql:postgresql:$postgresql_version"
    api "com.h2database:h2:$h2_version"
    api "org.modelmapper:modelmapper:$modelmapper_version"
}