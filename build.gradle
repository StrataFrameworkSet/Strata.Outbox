project.buildDir = ".build"
wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"

ext {
    springboot_version = "3.1.5"
    hibernate_version = "5.6.11.Final"
    major = "1"
    minor = ".0"
    patch = "-SNAPSHOT"
}

apply plugin: 'java'
group 'strata.outbox'
version "$major$minor$patch"

task buildAll {
    dependsOn getTasksByName('build',true)
}
