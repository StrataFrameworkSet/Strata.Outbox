plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

sourceSets {
    testFixtures.java.srcDirs = ['src/testFixtures/java']
    testFixtures.resources.srcDirs = ['src/testFixtures/resources']
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
    main.java.srcDirs = ['src/unused']
}


dependencies {
    testImplementation project(':Components:Strata.Outbox.Service')
    testImplementation platform("org.junit:junit-bom:$junit_jupiter_version")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testFixturesImplementation project(':Components:Strata.Outbox.Service')
    testFixturesImplementation platform("org.junit:junit-bom:$junit_jupiter_version")
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}

tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
    from sourceSets.testFixtures.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    testArtifacts {
        canBeResolved = false
        canBeConsumed = true
        extendsFrom testImplementation, testRuntimeOnly
        outgoing {
            capability("${project.group}:${project.name}-tests:${project.version}")
        }
    }
}

artifacts {
    testArtifacts testJar
}
