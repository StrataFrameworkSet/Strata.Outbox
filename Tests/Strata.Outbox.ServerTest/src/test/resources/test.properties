jakarta.persistence.persistence-unit=repository-test

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=test-user
spring.datasource.password=test-password
spring.datasource.url=jdbc:postgresql://localhost:5432/test
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.mapping-resources=OutboxEvent.orm.xml
spring.guice.dedup=true

logging.level.org.springframework.security=TRACE

# Basic Debezium engine properties
debezium.name=outbox-worker
debezium.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.offset.storage.file.filename=C:/temp/debezium/offsets.dat
debezium.offset.flush.interval.ms=60000

# PostgreSQL connector configuration
debezium.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.database.hostname=localhost
debezium.database.port=5432
debezium.database.user=test-user
debezium.database.password=test-password
debezium.database.dbname=test
debezium.database.server.name=PostgreSQL-17

# Skip update, delete, and truncate operations - only include insert (c) operations
debezium.skipped.operations=u,d,t

# Table inclusion configuration
debezium.table.include.list=public.outboxevent

# Outbox specific configurations
debezium.topic.prefix=outbox
debezium.plugin.name=pgoutput

# Schema handling
debezium.schema.include.list=public
debezium.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.schema.history.internal.file.filename=C:/temp/debezium/schema-history.dat

