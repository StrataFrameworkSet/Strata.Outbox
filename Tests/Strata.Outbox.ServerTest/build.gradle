plugins {
    id 'java-library'
}

sourceSets {
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
    main.java.srcDirs = ['src/unused']
}


dependencies {
    testImplementation project(':Components:Strata.Outbox.Server')
    testImplementation(testFixtures(project(':Tests:Strata.Outbox.CoreTest')))
    testImplementation(testFixtures(project(':Tests:Strata.Outbox.ServiceTest')))
    testImplementation "org.springframework.boot:spring-boot-starter:$springboot_version"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springboot_version"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_jupiter_version"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_platform_version"
    testImplementation "org.postgresql:postgresql:$postgresql_version"
    testImplementation "com.h2database:h2:$h2_version"
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}

tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    testArtifacts {
        canBeResolved = false
        canBeConsumed = true
        extendsFrom testImplementation, testRuntimeOnly
        outgoing {
            capability("${project.group}:${project.name}-tests:${project.version}")
        }
    }
}

artifacts {
    testArtifacts testJar
}
