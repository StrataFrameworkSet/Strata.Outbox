plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

sourceSets {
    testFixtures.java.srcDirs = ['src/testFixtures/java']
    testFixtures.resources.srcDirs = ['src/testFixtures/resources']
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
    main.java.srcDirs = ['src/unused']
}


dependencies {
    testImplementation project(':Components:Strata.Outbox.Core')
    testImplementation platform("org.junit:junit-bom:$junit_jupiter_version")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "strata.server:strata-server-spring:$strata_server_version"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springboot_version"
    testImplementation "org.postgresql:postgresql:$postgresql_version"
    testImplementation "com.h2database:h2:$h2_version"

    testFixturesImplementation project(':Components:Strata.Outbox.Core')
    testFixturesImplementation platform("org.junit:junit-bom:$junit_jupiter_version")
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
    testFixturesImplementation "strata.server:strata-server-spring:$strata_server_version"
    testFixturesImplementation "org.springframework.boot:spring-boot-starter-test:$springboot_version"
    testFixturesImplementation "org.postgresql:postgresql:$postgresql_version"
    testFixturesImplementation "com.h2database:h2:$h2_version"

/*
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_jupiter_version"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
*/
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}

tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
    from sourceSets.testFixtures.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    testArtifacts {
        canBeResolved = false
        canBeConsumed = true
        extendsFrom testImplementation, testRuntimeOnly
        outgoing {
            capability("${project.group}:${project.name}-tests:${project.version}")
        }
    }
}

artifacts {
    testArtifacts testJar
}
