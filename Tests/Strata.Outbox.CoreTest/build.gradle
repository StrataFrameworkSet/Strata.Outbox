plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

sourceSets {
    testFixtures.java.srcDirs = ['src/testFixtures/java']
    testFixtures.resources.srcDirs = ['src/testFixtures/resources']
    test.java.srcDirs = ['src/test/java']
    test.resources.srcDirs = ['src/test/resources']
    main.java.srcDirs = ['src/unused']
}

group 'strata.outbox'
version '1.0-SNAPSHOT'

dependencies {
    testImplementation project(':Components:Strata.Outbox.Core')
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "strata.server:strata-server-spring:$version"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springboot_version"
    testImplementation 'org.postgresql:postgresql:42.6.0'
    testImplementation 'com.h2database:h2:2.1.214'

    testFixturesImplementation project(':Components:Strata.Outbox.Core')
    testFixturesImplementation platform('org.junit:junit-bom:5.9.1')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
    testFixturesImplementation "strata.server:strata-server-spring:$version"
    testFixturesImplementation "org.springframework.boot:spring-boot-starter-test:$springboot_version"
    testFixturesImplementation 'org.postgresql:postgresql:42.6.0'
    testFixturesImplementation 'com.h2database:h2:2.1.214'

/*
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
*/
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}