plugins {
    id 'java'
    id "com.google.cloud.tools.jib" version "3.5.4"
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

apply plugin: 'maven-publish'

dependencies {
    implementation project(':Components:Strata.Outbox.Service')
    implementation project(':Components:Strata.Outbox.Server')
    implementation project(':Components:Strata.Outbox.Client')
    implementation project(path: ':Tests:Strata.Outbox.ServerTest', configuration: 'testArtifacts')
    implementation project(path: ':Tests:Strata.Outbox.ClientTest', configuration: 'testArtifacts')
    implementation project(path: ':Tests:Strata.Outbox.CoreTest', configuration: 'testArtifacts')
    implementation project(path: ':Tests:Strata.Outbox.ServiceTest', configuration: 'testArtifacts')
    implementation "strata.foundation:strata-foundation-core:$strata_foundation_version"
    implementation "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
    implementation "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
    implementation "org.junit.platform:junit-platform-launcher:$junit_platform_version"
}

publishing {
    publications {
        StrataOutboxTestSuite(MavenPublication) {
            artifactId = 'strata-outbox-testsuite'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

jib {
    from {
        image = "amazoncorretto:23"
        auth {
            username = "$System.env.DOCKER_USER"
            password = "$System.env.DOCKER_PASSWORD"
        }
    }
    to {
        image = "ghcr.io/johnliebenau/strata/strata-outbox-testsuite"
        auth {
            username = "$System.env.REPOSITORY_USER"
            password = "$System.env.REPOSITORY_PASSWORD"
        }
    }
    container {
        environment = [DEPLOY_ENV:"test"]
        jvmFlags = [
            '-Xmx1024m',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED']

        mainClass = "strata.foundation.core.testrunner.JunitTestRunner"
        args = ['--tags=CommitStage','--package=strata.outbox']
        expandClasspathDependencies = true
        format = 'OCI'
    }
}
apply from: rootProject.file('gradle/strata-image.gradle')

tasks.named('build') {
    finalizedBy('jib')
}
